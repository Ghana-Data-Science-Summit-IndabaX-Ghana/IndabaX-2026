# Apache Airflow - demo setup for the agrivoltaics pipeline DAG.
#
# A single "standalone" container (scheduler + api-server + dag-processor +
# triggerer in one process, backed by SQLite). This is the simplest reliable way
# to demo the DAG - not a production deployment.
#
#   docker compose up            # start (first run pulls the image + installs deps)
#   open http://localhost:8080   # UI; admin password is printed in the logs
#   docker compose down          # stop
#
# Find the admin password:
#   docker compose logs airflow | grep -i "password"
#
# For a "real" setup (Postgres + LocalExecutor, deps baked into a custom image),
# use the Astro CLI instead - see 04_Bonus_Airflow.md.

x-airflow-env: &airflow-env
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  # The DAG resolves the project (and its src/, data/, outputs/) from here.
  AGRI_PROJECT: /opt/airflow
  # Demo convenience: install the pipeline's deps when the container starts.
  # For anything real, bake these into a custom image instead.
  _PIP_ADDITIONAL_REQUIREMENTS: "pandas openpyxl pyarrow"

services:
  airflow:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.0.2}
    command: standalone
    # Runs as the image's airflow user; on Linux set AIRFLOW_UID to your host UID
    # (echo $(id -u)) so files written to mounted folders stay writable.
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      <<: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./outputs:/opt/airflow/outputs
      - ./logs:/opt/airflow/logs
    restart: unless-stopped
